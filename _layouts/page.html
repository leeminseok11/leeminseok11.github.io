---
layout: default
---
<article class="page">
  <header class="page-head">
    {% if page.eyebrow %}<div class="eyebrow mono">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="muted lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
