<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <div class="footer-left">
      <span class="mono">© {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
      <span class="muted">Built with Jekyll · GitHub Pages</span>
    </div>
    <nav class="footer-links" aria-label="바로가기">
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:{{ site.author.email }}">Email</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
      <a href="#" class="to-top">맨 위로 ↑</a>
    </nav>
  </div>
</footer>
